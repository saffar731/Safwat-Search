<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safwat Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./icon.png">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }, 
                    colors: { braveOrange: '#ff4500', braveGray: '#1c1e21' } 
                } 
            } 
        }
    </script>
    <style>
        body { 
            background: #0f1112 no-repeat center center fixed; 
            background-size: cover; 
            transition: background 0.5s ease;
        }
        .glass { background: rgba(15, 17, 18, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); }
        #main-overlay { background: rgba(0,0,0,0.4); position: fixed; inset: 0; z-index: -1; }
        .dev-active { border-color: #ff4500 !important; color: #ff4500 !important; background: rgba(255, 69, 0, 0.1); }
    </style>
</head>
<body class="text-gray-100 min-h-screen">
    <div id="main-overlay"></div>

    <div id="home-view" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="text-center mb-10">
            <img src="logo.png" alt="Safwat Logo" class="w-32 h-32 mx-auto mb-4 drop-shadow-2xl">
            <h1 class="text-7xl font-black tracking-tighter">Safwat</h1>
        </div>

        <div class="w-full max-w-2xl">
            <div class="relative group">
                <input type="text" id="homeInput" onkeypress="if(event.key==='Enter') executeSearch('homeInput')"
                    class="w-full bg-zinc-900/90 border border-zinc-700 py-5 px-14 rounded-full text-lg focus:ring-2 focus:ring-braveOrange focus:outline-none transition-all shadow-2xl" 
                    placeholder="Search the web securely...">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-6 text-gray-500 group-focus-within:text-braveOrange"></i>
            </div>
            
            <div class="flex justify-center mt-6">
                <button id="dev-btn-home" onclick="toggleDev()" class="flex items-center gap-2 px-6 py-2 rounded-full border border-zinc-700 hover:bg-white/5 transition-all text-sm">
                    <i class="fa-solid fa-code"></i> Web Developer Filter
                </button>
            </div>
        </div>
    </div>

    <div id="results-view" class="hidden flex flex-col min-h-screen">
        <nav class="sticky top-0 glass border-b border-zinc-800 p-4 z-50">
            <div class="max-w-[1400px] mx-auto flex items-center gap-6">
                <img src="logo.png" class="w-10 h-10 cursor-pointer" onclick="location.reload()">
                <div class="relative flex-1 max-w-2xl">
                    <input type="text" id="resultsInput" onkeypress="if(event.key==='Enter') executeSearch('resultsInput')"
                        class="w-full bg-zinc-800 border border-zinc-700 py-2.5 px-12 rounded-full focus:ring-1 focus:ring-braveOrange focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-5 top-3.5 text-gray-500 text-xs"></i>
                </div>
                <button id="dev-btn-nav" onclick="toggleDev()" class="px-4 py-2 rounded-lg border border-zinc-700 text-[10px] font-bold uppercase">Dev Mode</button>
            </div>
        </nav>

        <div class="max-w-[1400px] mx-auto w-full p-6 grid grid-cols-1 md:grid-cols-[1fr_350px] gap-10">
            <div id="web-list" class="space-y-10 order-2 md:order-1"></div>
            
            <aside class="order-1 md:order-2">
                <div class="glass p-6 rounded-3xl sticky top-28">
                    <h3 class="text-[10px] font-bold text-braveOrange uppercase tracking-widest mb-3">AI Intelligence</h3>
                    <p id="ai-text" class="text-sm text-gray-300 leading-relaxed italic">Consulting Safwat index...</p>
                    <div class="mt-4 pt-4 border-t border-zinc-800 text-[9px] text-gray-500 font-mono">
                        URL SID: <span id="sid-display"></span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="fixed bottom-6 left-6 z-50">
        <button onclick="document.getElementById('bg-menu').classList.toggle('hidden')" class="bg-zinc-800 p-3 rounded-full border border-zinc-700 shadow-xl">
            <i class="fa-solid fa-image text-braveOrange"></i>
        </button>
        <div id="bg-menu" class="hidden absolute bottom-14 left-0 glass p-4 rounded-xl w-48 shadow-2xl">
            <input type="file" id="bg-file" class="hidden" accept="image/*" onchange="handleBg(event)">
            <button onclick="document.getElementById('bg-file').click()" class="w-full text-left p-2 text-xs hover:bg-white/10 rounded">Custom Background</button>
            <button onclick="localStorage.removeItem('saf-bg'); location.reload();" class="w-full text-left p-2 text-xs text-red-400 hover:bg-white/10 rounded mt-1">Reset Background</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyBH3w8cADRTxz8kTyuJFJGifb-Zo5VNsyw"; 
        const MODEL = "gemini-2.5-flash"; // Set to 2.5 Flash as requested
        let isDev = false;

        function toggleDev() {
            isDev = !isDev;
            document.getElementById('dev-btn-home').classList.toggle('dev-active', isDev);
            document.getElementById('dev-btn-nav').classList.toggle('dev-active', isDev);
        }

        async function executeSearch(inputId) {
            const query = document.getElementById(inputId).value;
            if(!query) return;

            const sid = 'SAF-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            window.history.pushState({query, sid}, '', `?q=${encodeURIComponent(query)}&sid=${sid}`);
            
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');
            document.getElementById('resultsInput').value = query;
            document.getElementById('sid-display').innerText = sid;

            const list = document.getElementById('web-list');
            const aiText = document.getElementById('ai-text');
            list.innerHTML = '<div class="animate-pulse text-gray-500">Searching...</div>';
            aiText.innerText = "Analyzing query...";

            const finalQuery = isDev ? `${query} developer documentation source code` : query;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Search for "${finalQuery}". Return JSON: {"summary": "...", "results": [{"title": "...", "url": "...", "snippet": "..."}]}` }]}] })
                });
                const data = await response.json();
                const res = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));

                aiText.innerText = res.summary;
                list.innerHTML = res.results.map(item => `
                    <div class="group">
                        <p class="text-[10px] text-gray-500 mb-1">${new URL(item.url).hostname}</p>
                        <a href="${item.url}" target="_blank" class="text-xl font-semibold text-blue-400 group-hover:underline underline-offset-4">${item.title}</a>
                        <p class="text-sm text-gray-400 mt-2">${item.snippet}</p>
                    </div>
                `).join('');
            } catch (e) { aiText.innerText = "Error: Check API Key or Model availability."; }
        }

        function handleBg(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.body.style.backgroundImage = `url('${event.target.result}')`;
                localStorage.setItem('saf-bg', event.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        window.onload = () => {
            const bg = localStorage.getItem('saf-bg');
            if(bg) document.body.style.backgroundImage = `url('${bg}')`;
            
            const params = new URLSearchParams(window.location.search);
            if(params.get('q')) {
                document.getElementById('homeInput').value = params.get('q');
                executeSearch('homeInput');
            }
        };
    </script>
</body>
</html>
